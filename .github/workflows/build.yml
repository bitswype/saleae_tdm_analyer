name: Build

on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A x64
        cmake --build ${{github.workspace}}/build --config Release
    - name: Build tests
      run: |
        cmake -B ${{github.workspace}}/build-test -DBUILD_TESTS=ON -A x64
        cmake --build ${{github.workspace}}/build-test --config Release --target tdm_correctness
    - name: Run correctness tests
      run: ${{github.workspace}}/build-test/bin/Release/tdm_correctness.exe
    - name: Upload windows build
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll
  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build/x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
        cmake --build ${{github.workspace}}/build/x86_64
        cmake -B ${{github.workspace}}/build/arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build ${{github.workspace}}/build/arm64
    - name: Build and run correctness tests
      run: |
        cmake -B ${{github.workspace}}/build-test -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build ${{github.workspace}}/build-test --target tdm_correctness
        ${{github.workspace}}/build-test/bin/tdm_correctness
    - name: Upload MacOS x86_64 build
      uses: actions/upload-artifact@v4
      with:
        name: macos_x86_64
        path: ${{github.workspace}}/build/x86_64/Analyzers/*.so
    - name: Upload MacOS arm64 build
      uses: actions/upload-artifact@v4
      with:
        name: macos_arm64
        path: ${{github.workspace}}/build/arm64/Analyzers/*.so
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
        cmake --build ${{github.workspace}}/build
      env:
        CC:   gcc-14
        CXX:  g++-14
    - name: Build and run correctness tests
      run: |
        cmake -B ${{github.workspace}}/build-test -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build ${{github.workspace}}/build-test --target tdm_correctness
        ${{github.workspace}}/build-test/bin/tdm_correctness
      env:
        CC:   gcc-14
        CXX:  g++-14
    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: linux
        path: ${{github.workspace}}/build/Analyzers/*.so
  # Python HLA decode oracle against every compiled backend, plus the audio
  # bridge protocol tests. Deliberately not a dependency of `publish`: a
  # release should not be blocked by a Python toolchain hiccup, but a red
  # mark on the commit is wanted. Without this job only the pure-Python
  # backend would ever be exercised automatically, which is how the
  # source-width bug (issue #10) shipped in all four backends.
  python-hla-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build and test dependencies
      run: python -m pip install --upgrade pip setuptools cython cffi pytest
    - name: Build decode extensions
      working-directory: ${{github.workspace}}/hla-audio-stream
      run: |
        python setup_cython.py build_ext --inplace
        python setup_rawc.py build_ext --inplace
        python _decode_cffi_build.py
    - name: Run HLA oracle against each backend
      run: |
        for b in cython rawc cffi python; do
          echo "=== backend: $b ==="
          TDM_HLA_BACKEND=$b python -m pytest tests/test_hla_decode.py -q -p no:cacheprovider
        done
    - name: Run audio bridge protocol tests
      run: python -m pytest tests/test_audio_bridge_protocol.py -q -p no:cacheprovider
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: download individual builds
      uses: actions/download-artifact@v4
      with:
        path: ${{github.workspace}}/artifacts
    - name: generate version and bundle HLAs and tools
      run: |
        python3 ${{github.workspace}}/tools/tdm-audio-bridge/gen_version.py
        rsync -a --exclude='__pycache__' --exclude='*.egg-info' --exclude='build/' \
          ${{github.workspace}}/hla-wav-export/ ${{github.workspace}}/artifacts/hla-wav-export/
        rsync -a --exclude='__pycache__' --exclude='*.egg-info' --exclude='build/' \
          ${{github.workspace}}/hla-audio-stream/ ${{github.workspace}}/artifacts/hla-audio-stream/
        rsync -a --exclude='__pycache__' --exclude='*.egg-info' --exclude='build/' \
          ${{github.workspace}}/tools/ ${{github.workspace}}/artifacts/tools/
        cp ${{github.workspace}}/README.md ${{github.workspace}}/artifacts/
        cp ${{github.workspace}}/LICENSE ${{github.workspace}}/artifacts/
    - name: zip
      run: |
        cd ${{github.workspace}}/artifacts
        zip -r ${{github.workspace}}/analyzer.zip .
    - uses: actions/upload-artifact@v4
      with:
        name: all-platforms
        path: ${{github.workspace}}/artifacts/**
    - name: create release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: ${{github.workspace}}/analyzer.zip
